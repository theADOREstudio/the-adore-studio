<title>Gallery | The Adore Studio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#ffffff;
    color:#333;
    font-family:Georgia, serif;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    padding:22px 50px;
    border-bottom:1px solid #e6e6e6;
}

.logo{
    width:230px;
    height:auto;
}

nav{
    display:flex;
    gap:32px;
}

nav a{
    color:#666;
    text-decoration:none;
    font-size:16px;
    letter-spacing:1px;
}

nav a:hover{
    color:#1d5f97;
}

main{
    max-width:1500px;
    margin:0 auto;
    padding:50px 28px 70px;
}

h1{
    text-align:center;
    font-size:46px;
    font-weight:normal;
    margin:0 0 45px;
}

.gallery{
    columns:3 320px;
    column-gap:22px;
}

.gallery img{
    display:block;
    width:100%;
    height:auto;
    margin:0 0 22px;
    break-inside:avoid;
}

footer{
    text-align:center;
    padding:35px 20px;
    color:#999;
    border-top:1px solid #e6e6e6;
}

@media (max-width:700px){
    header{
        flex-direction:column;
        padding:20px;
    }

    .logo{
        width:220px;
    }

    nav{
        gap:18px;
        flex-wrap:wrap;
        justify-content:center;
    }

    main{
        padding:35px 15px 50px;
    }

    h1{
        font-size:36px;
    }
}
</style>
</head>
