<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#333;
    font-family:Georgia, serif;
}

body.lightbox-open{
    overflow:hidden;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    padding:22px 50px;
    border-bottom:1px solid #e6e6e6;
    background:#ffffff;
}

.logo{
    width:230px;
    height:auto;
    display:block;
}

nav{
    display:flex;
    gap:32px;
}

nav a{
    color:#666;
    text-decoration:none;
    font-size:16px;
    letter-spacing:1px;
}

nav a:hover{
    color:#1d5f97;
}

main{
    max-width:1500px;
    margin:0 auto;
    padding:50px 28px 70px;
}

h1{
    text-align:center;
    font-size:46px;
    font-weight:normal;
    margin:0 0 45px;
}

.gallery{
    columns:3 320px;
    column-gap:22px;
}

.gallery img{
    display:block;
    width:100%;
    height:auto;
    margin:0 0 22px;
    break-inside:avoid;
    cursor:pointer;
    transition:opacity .2s ease;
}

.gallery img:hover{
    opacity:.88;
}

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.94);
    align-items:center;
    justify-content:center;
    padding:35px 75px;
}

.lightbox.active{
    display:flex;
}

.lightbox-image{
    display:block;
    max-width:94vw;
    max-height:90vh;
    width:auto;
    height:auto;
    object-fit:contain;
    box-shadow:0 0 30px rgba(0,0,0,.45);
}

.lightbox-close,
.lightbox-arrow{
    position:absolute;
    border:0;
    background:transparent;
    color:#ffffff;
    font-family:Arial, sans-serif;
    cursor:pointer;
    line-height:1;
    opacity:.9;
}

.lightbox-close:hover,
.lightbox-arrow:hover{
    opacity:.65;
}

.lightbox-close{
    top:18px;
    right:28px;
    font-size:46px;
}

.lightbox-arrow{
    top:50%;
    transform:translateY(-50%);
    font-size:58px;
    padding:18px;
}

.lightbox-prev{
    left:10px;
}

.lightbox-next{
    right:10px;
}

footer{
    text-align:center;
    padding:35px 20px;
    color:#999;
    border-top:1px solid #e6e6e6;
}

@media (max-width:700px){
    header{
        flex-direction:column;
        padding:20px;
    }

    .logo{
        width:220px;
    }

    nav{
        gap:18px;
        flex-wrap:wrap;
        justify-content:center;
    }

    main{
        padding:35px 15px 50px;
    }

    h1{
        font-size:36px;
    }

    .lightbox{
        padding:55px 15px 25px;
    }

    .lightbox-arrow{
        font-size:44px;
        padding:10px;
    }

    .lightbox-close{
        top:12px;
        right:18px;
        font-size:42px;
    }
}
</style>

<div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#10094;</button>
    <img class="lightbox-image" id="lightboxImage" src="" alt="">
    <button class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Next image">&#10095;</button>
</div>

<script>
const galleryImages = Array.from(document.querySelectorAll('.gallery img'));
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
const lightboxClose = document.getElementById('lightboxClose');
const lightboxPrev = document.getElementById('lightboxPrev');
const lightboxNext = document.getElementById('lightboxNext');

let currentIndex = 0;

function showImage(index) {
    currentIndex = (index + galleryImages.length) % galleryImages.length;
    const selectedImage = galleryImages[currentIndex];

    lightboxImage.src = selectedImage.src;
    lightboxImage.alt = selectedImage.alt;
}

function openLightbox(index) {
    showImage(index);
    lightbox.classList.add('active');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lightbox-open');
}

function closeLightbox() {
    lightbox.classList.remove('active');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lightbox-open');
    lightboxImage.src = '';
}

galleryImages.forEach((image, index) => {
    image.addEventListener('click', () => openLightbox(index));
});

lightboxClose.addEventListener('click', closeLightbox);
lightboxPrev.addEventListener('click', event => {
    event.stopPropagation();
    showImage(currentIndex - 1);
});
lightboxNext.addEventListener('click', event => {
    event.stopPropagation();
    showImage(currentIndex + 1);
});

lightbox.addEventListener('click', event => {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

document.addEventListener('keydown', event => {
    if (!lightbox.classList.contains('active')) return;

    if (event.key === 'Escape') closeLightbox();
    if (event.key === 'ArrowLeft') showImage(currentIndex - 1);
    if (event.key === 'ArrowRight') showImage(currentIndex + 1);
});
</script>
