
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | The Adore Studio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#ffffff;
    color:#333;
    font-family:Georgia, serif;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    padding:22px 50px;
    border-bottom:1px solid #e6e6e6;
}

.logo{
    width:230px;
    height:auto;
}

nav{
    display:flex;
    gap:32px;
}

nav a{
    color:#666;
    text-decoration:none;
    font-size:16px;
    letter-spacing:1px;
}

nav a:hover{
    color:#1d5f97;
}

main{
    max-width:1500px;
    margin:0 auto;
    padding:50px 28px 70px;
}

h1{
    text-align:center;
    font-size:46px;
    font-weight:normal;
    margin:0 0 45px;
}

.gallery{
    columns:3 320px;
    column-gap:22px;
}

.gallery img{
    display:block;
    width:100%;
    height:auto;
    margin:0 0 22px;
    break-inside:avoid;
}

footer{
    text-align:center;
    padding:35px 20px;
    color:#999;
    border-top:1px solid #e6e6e6;
}

@media (max-width:700px){
    header{
        flex-direction:column;
        padding:20px;
    }

    .logo{
        width:220px;
    }

    nav{
        gap:18px;
        flex-wrap:wrap;
        justify-content:center;
    }

    main{
        padding:35px 15px 50px;
    }

    h1{
        font-size:36px;
    }
}
</style>
</head>

<body>

<header>

<a href="index.html">
    <img src="oglogo.png" alt="The Adore Studio" class="logo">
</a>

<nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="books.html">Books</a>
    <a href="#">Prints</a>
    <a href="#">About</a>
</nav>

</header>

<main>

<h1>Gallery</h1>

<div class="gallery">

    <img src="gallery1.jpg" alt="Fine art photograph by Theodore Paulson">
    <img src="gallery2.jpg" alt="Fine art photograph by Theodore Paulson">
    <img src="gallery3.jpg" alt="Fine art photograph by Theodore Paulson">
    <img src="gallery4.jpg" alt="Fine art photograph by Theodore Paulson">
    <img src="gallery5.jpg" alt="Fine art photograph by Theodore Paulson">
    <img src="gallery6.jpg" alt="Fine art photograph by Theodore Paulson">

</div>

</main>

<footer>
© 2026 The Adore Studio
</footer>

</body>
</html>
