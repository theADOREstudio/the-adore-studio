<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Adore Studio</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Georgia, serif;
}

.site-header{
    background:#111;
    text-align:center;
    padding:30px 20px 24px;
}

.logo{
    width:min(500px, 75vw);
    height:auto;
    display:block;
    margin:0 auto;
}

.tagline{
    margin:4px 0 0;
    color:#ddd;
    font-size:22px;
    letter-spacing:1px;
}

.hero img{
    display:block;
    width:100%;
    height:auto;
}

footer{
    text-align:center;
    padding:40px;
    color:#777;
}
</style>
</head>

<body>

<header class="site-header">
    <img
        src="ChatGPT Image Jul 24, 2026, 03_06_21 PM.png"
        alt="The Adore Studio"
        class="logo"
    >
    <p class="tagline">Photography by Theodore Paulson</p>
</header>

<main class="hero">
    <img
        src="Hero.jpg"
        alt="Surfer walking along the beach at sunset"
    >
</main>

<footer>
© 2026 The Adore Studio
</footer>

</body>
</html>
