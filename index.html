<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="The Adore Studio — Photography by Theodore Paulson">

  <title>The Adore Studio</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ======================================================
       SLIDESHOW
       ====================================================== */

    #slideshow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
    }

    .slide {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      opacity: 0;

      transition: opacity 2s ease-in-out;

      user-select: none;
      -webkit-user-drag: none;
    }

    .slide.active {
      opacity: 1;
    }

    /* Subtle darkness behind navigation */

    .shade {
      position: fixed;
      inset: 0;

      z-index: 2;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.38) 0%,
          rgba(0,0,0,.08) 25%,
          rgba(0,0,0,.02) 65%,
          rgba(0,0,0,.22) 100%
        );
    }


    /* ======================================================
       HEADER
       ====================================================== */

    header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      z-index: 20;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 30px 40px;
    }

    .brand {
      color: #fff;

      text-decoration: none;

      text-transform: uppercase;

      letter-spacing: .22em;

      font-size: 15px;
      font-weight: 400;

      white-space: nowrap;

      text-shadow: 0 1px 10px rgba(0,0,0,.65);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    nav a {
      color: #fff;

      text-decoration: none;

      text-transform: uppercase;

      letter-spacing: .15em;

      font-size: 11px;
      font-weight: 400;

      opacity: .82;

      transition: opacity .25s ease;

      text-shadow: 0 1px 10px rgba(0,0,0,.65);
    }

    nav a:hover {
      opacity: 1;
    }


    /* ======================================================
       SLIDESHOW ARROWS
       ====================================================== */

    .arrow {
      position: fixed;

      top: 50%;

      transform: translateY(-50%);

      z-index: 15;

      border: 0;
      outline: 0;

      background: transparent;

      color: #fff;

      font-size: 38px;
      font-weight: 200;

      padding: 30px 22px;

      cursor: pointer;

      opacity: 0;

      transition: opacity .3s ease;

      text-shadow: 0 1px 10px rgba(0,0,0,.7);
    }

    body:hover .arrow {
      opacity: .45;
    }

    .arrow:hover {
      opacity: 1 !important;
    }

    #previous {
      left: 0;
    }

    #next {
      right: 0;
    }


    /* ======================================================
       SMALL SLIDE INDICATOR
       ====================================================== */

    #counter {
      position: fixed;

      bottom: 24px;
      right: 30px;

      z-index: 15;

      color: rgba(255,255,255,.65);

      font-size: 10px;

      letter-spacing: .16em;

      opacity: 0;

      transition: opacity .3s ease;

      text-shadow: 0 1px 8px rgba(0,0,0,.6);
    }

    body:hover #counter {
      opacity: 1;
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 760px) {

      header {
        padding: 20px 18px;

        align-items: flex-start;
      }

      .brand {
        font-size: 11px;
        letter-spacing: .15em;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 9px;
        letter-spacing: .08em;
      }

      .arrow {
        display: none;
      }

      #counter {
        display: none;
      }

    }


    @media (max-width: 520px) {

      header {
        flex-direction: column;
        gap: 14px;
      }

      nav {
        width: 100%;
      }

    }

  </style>
</head>


<body>


  <!-- ======================================================
       SLIDESHOW
       ====================================================== -->

  <div id="slideshow"></div>

  <div class="shade"></div>


  <!-- ======================================================
       NAVIGATION
       ====================================================== -->

  <header>

    <a href="index.html" class="brand">
      The Adore Studio
    </a>

    <nav>

      <a href="gallery.html">
        Gallery
      </a>

      <a href="collections.html">
        Collections
      </a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>

    </nav>

  </header>


  <!-- ======================================================
       MANUAL CONTROLS
       ====================================================== -->

  <button
    id="previous"
    class="arrow"
    aria-label="Previous photograph"
  >
    &#10094;
  </button>


  <button
    id="next"
    class="arrow"
    aria-label="Next photograph"
  >
    &#10095;
  </button>


  <div id="counter"></div>


  <script>

    /* ======================================================

       Delete a line = remove image
       Add a filename = add image

      "Triptych_004-005-006_16x9.jpg",
      "Triptych_045-046-047_16x9.jpg",
      "Triptych_090-088-089_16x9.jpg",
      "Triptych_107-023-007_16x9.jpg"

    ];


    /* ======================================================
       SETTINGS
       ====================================================== */

    const slideDuration = 6500;

    const slideshow =
      document.getElementById("slideshow");

    const counter =
      document.getElementById("counter");

    const previousButton =
      document.getElementById("previous");

    const nextButton =
      document.getElementById("next");


    let currentIndex = 0;

    let timer = null;

    let slides = [];


    /* ======================================================
       CREATE SLIDES
       ====================================================== */

    function createSlides() {

      homeImages.forEach((filename, index) => {

        const image =
          document.createElement("img");

        image.src = filename;

        image.alt = "";

        image.className = "slide";

        image.loading =
          index < 2 ? "eager" : "lazy";

        if (index === 0) {

          image.classList.add("active");

        }

        slideshow.appendChild(image);

      });


      slides =
        Array.from(
          document.querySelectorAll(".slide")
        );


      updateCounter();

    }


    /* ======================================================
       SHOW A SLIDE
       ====================================================== */

    function showSlide(index) {

      if (!slides.length) {
        return;
      }


      slides[currentIndex]
        .classList
        .remove("active");


      currentIndex =
        (index + slides.length)
        % slides.length;


      slides[currentIndex]
        .classList
        .add("active");


      updateCounter();

    }


    /* ======================================================
       NEXT / PREVIOUS
       ====================================================== */

    function nextSlide() {

      showSlide(
        currentIndex + 1
      );

    }


    function previousSlide() {

      showSlide(
        currentIndex - 1
      );

    }


    /* ======================================================
       COUNTER
       ====================================================== */

    function updateCounter() {

      counter.textContent =
        `${currentIndex + 1} / ${homeImages.length}`;

    }


    /* ======================================================
       AUTOMATIC SLIDESHOW
       ====================================================== */

    function startTimer() {

      stopTimer();

      timer =
        setInterval(
          nextSlide,
          slideDuration
        );

    }


    function stopTimer() {

      if (timer) {

        clearInterval(timer);

        timer = null;

      }

    }


    function restartTimer() {

      startTimer();

    }


    /* ======================================================
       BUTTON CONTROLS
       ====================================================== */

    nextButton.addEventListener(
      "click",
      function() {

        nextSlide();

        restartTimer();

      }
    );


    previousButton.addEventListener(
      "click",
      function() {

        previousSlide();

        restartTimer();

      }
    );


    /* ======================================================
       KEYBOARD CONTROLS
       ====================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "ArrowRight"
        ) {

          nextSlide();

          restartTimer();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          previousSlide();

          restartTimer();

        }

      }
    );


    /* ======================================================
       SWIPE ON PHONE / TABLET
       ====================================================== */

    let touchStartX = 0;

    let touchEndX = 0;


    document.addEventListener(
      "touchstart",
      function(event) {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      {
        passive: true
      }
    );


    document.addEventListener(
      "touchend",
      function(event) {

        touchEndX =
          event.changedTouches[0].screenX;


        const distance =
          touchEndX - touchStartX;


        if (Math.abs(distance) < 50) {

          return;

        }


        if (distance < 0) {

          nextSlide();

        }
        else {

          previousSlide();

        }


        restartTimer();

      },
      {
        passive: true
      }
    );


    /* ======================================================
       PAUSE IF TAB IS NOT VISIBLE
       ====================================================== */

    document.addEventListener(
      "visibilitychange",
      function() {

        if (document.hidden) {

          stopTimer();

        }
        else {

          startTimer();

        }

      }
    );


    /* ======================================================
       START
       ====================================================== */

    createSlides();

    startTimer();

  </script>

</body>
</html>
