<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Adore Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#333;
    font-family:Georgia, serif;
}

body.lightbox-open{
    overflow:hidden;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    padding:22px 50px;
    border-bottom:1px solid #e6e6e6;
    background:#ffffff;
}

.logo{
    width:230px;
    height:auto;
    display:block;
}

nav{
    display:flex;
    gap:32px;
}

nav a{
    color:#666;
    text-decoration:none;
    font-size:16px;
    letter-spacing:1px;
    transition:color .2s ease;
}

nav a:hover{
    color:#1d5f97;
}

/* PAGE */

main{
    max-width:1560px;
    margin:0 auto;
    padding:58px 34px 85px;
}

.gallery-heading{
    text-align:center;
    margin-bottom:58px;
}

h1{
    font-size:46px;
    font-weight:normal;
    margin-bottom:12px;
}

.gallery-subtitle{
    color:#777;
    font-size:18px;
    line-height:1.6;
}

/* ORDERED MASONRY GALLERY */

.gallery{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    grid-auto-rows:8px;
    column-gap:32px;
    row-gap:0;
    align-items:start;
}

.gallery-item{
    width:100%;
    margin-bottom:32px;
}

.gallery-item img{
    display:block;
    width:100%;
    height:auto;
    cursor:pointer;
    background:#f3f3f1;
    box-shadow:0 3px 14px rgba(0,0,0,.06);
    transition:
        transform .28s ease,
        box-shadow .28s ease;
}

.gallery-item img:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 28px rgba(0,0,0,.13);
}

/* LIGHTBOX */

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:#f7f7f4;
    align-items:center;
    justify-content:center;
    padding:34px 90px;
}

.lightbox.active{
    display:flex;
}

.lightbox-content{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.lightbox-frame{
    display:flex;
    align-items:center;
    justify-content:center;
    max-width:92vw;
    max-height:78vh;
    padding:18px;
    background:#ffffff;
    box-shadow:0 18px 48px rgba(0,0,0,.16);
}

.lightbox-image{
    display:block;
    max-width:86vw;
    max-height:72vh;
    width:auto;
    height:auto;
    object-fit:contain;
}

.lightbox-caption{
    margin-top:22px;
    text-align:center;
    color:#555;
}

.lightbox-title{
    font-size:20px;
    margin-bottom:5px;
}

.lightbox-studio{
    color:#888;
    font-size:15px;
    letter-spacing:1.6px;
    text-transform:uppercase;
}

/* LIGHTBOX CONTROLS */

.lightbox-close,
.lightbox-arrow{
    position:absolute;
    border:0;
    background:transparent;
    color:#444;
    font-family:Arial, sans-serif;
    cursor:pointer;
    line-height:1;
    opacity:.78;
    transition:
        opacity .2s ease,
        transform .2s ease;
}

.lightbox-close:hover,
.lightbox-arrow:hover{
    opacity:1;
}

.lightbox-close{
    top:18px;
    right:28px;
    font-size:46px;
}

.lightbox-arrow{
    top:50%;
    transform:translateY(-50%);
    padding:18px;
    font-size:56px;
}

.lightbox-arrow:hover{
    transform:translateY(-50%) scale(1.06);
}

.lightbox-prev{
    left:12px;
}

.lightbox-next{
    right:12px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:38px 20px;
    color:#999;
    border-top:1px solid #e6e6e6;
}

/* TABLET */

@media(max-width:900px){

    header{
        flex-direction:column;
        padding:22px;
    }

    nav{
        justify-content:center;
        flex-wrap:wrap;
        gap:20px;
    }

    main{
        padding:42px 20px 65px;
    }

    .gallery-heading{
        margin-bottom:42px;
    }

    .gallery{
        grid-template-columns:repeat(2, minmax(0, 1fr));
        column-gap:22px;
    }

    .gallery-item{
        margin-bottom:22px;
    }

    .lightbox{
        padding:58px 52px 30px;
    }

}

/* PHONE */

@media(max-width:600px){

    .logo{
        width:220px;
    }

    h1{
        font-size:36px;
    }

    .gallery-subtitle{
        font-size:16px;
    }

    .gallery{
        display:block;
    }

    .gallery-item{
        margin-bottom:22px;
    }

    .lightbox{
        padding:58px 12px 24px;
    }

    .lightbox-frame{
        max-width:94vw;
        padding:8px;
    }

    .lightbox-image{
        max-width:90vw;
        max-height:66vh;
    }

    .lightbox-arrow{
        top:auto;
        bottom:18px;
        transform:none;
        padding:8px 14px;
        font-size:42px;
    }

    .lightbox-arrow:hover{
        transform:scale(1.06);
    }

    .lightbox-prev{
        left:18px;
    }

    .lightbox-next{
        right:18px;
    }

    .lightbox-close{
        top:10px;
        right:16px;
        font-size:42px;
    }

    .lightbox-caption{
        margin-top:16px;
        padding-bottom:42px;
    }

}

</style>

</head>

<body>

<header>

<a href="index.html">

    <img
        src="oglogo.png"
        alt="The Adore Studio"
        class="logo">

</a>

<nav>

    <a href="index.html">Gallery</a>

    <a href="books.html">Books</a>

    <a href="prints.html">Prints</a>

    <a href="about.html">About</a>

</nav>

</header>

<main>

<div class="gallery-heading">

    <h1>Gallery</h1>

    <p class="gallery-subtitle">
        A curated collection exploring Oregon's North Coast.
    </p>

</div>

<div
    class="gallery"
    id="gallery">
</div>

</main>

<footer>
    © 2026 The Adore Studio
</footer>

<div
    class="lightbox"
    id="lightbox"
    aria-hidden="true">

    <button
        class="lightbox-close"
        id="lightboxClose"
        aria-label="Close">

        &times;

    </button>

    <button
        class="lightbox-arrow lightbox-prev"
        id="lightboxPrev"
        aria-label="Previous image">

        &#10094;

    </button>

    <div class="lightbox-content">

        <div class="lightbox-frame">

            <img
                class="lightbox-image"
                id="lightboxImage"
                src=""
                alt="">

        </div>

        <div class="lightbox-caption">

            <div
                class="lightbox-title"
                id="lightboxTitle">
            </div>

            <div class="lightbox-studio">
                The Adore Studio
            </div>

        </div>

    </div>

    <button
        class="lightbox-arrow lightbox-next"
        id="lightboxNext"
        aria-label="Next image">

        &#10095;

    </button>

</div>

<!--
The version number forces the browser to retrieve
the newest gallery.js instead of showing an old cached copy.
Increase this number whenever necessary.
-->

<script src="gallery.js?v=5"></script>

<script>

const gallery =
    document.getElementById('gallery');

const lightbox =
    document.getElementById('lightbox');

const lightboxImage =
    document.getElementById('lightboxImage');

const lightboxTitle =
    document.getElementById('lightboxTitle');

const lightboxClose =
    document.getElementById('lightboxClose');

const lightboxPrev =
    document.getElementById('lightboxPrev');

const lightboxNext =
    document.getElementById('lightboxNext');

let currentIndex = 0;


/* BUILD THE GALLERY */

galleryOrder.forEach((item, index) => {

    const galleryItem =
        document.createElement('div');

    galleryItem.className =
        'gallery-item';

    const image =
        document.createElement('img');

    image.src =
        item.image;

    image.alt =
        item.title ||
        'Fine art photograph by Theodore Paulson';

    image.loading =
        index < 9 ? 'eager' : 'lazy';

    image.addEventListener(
        'click',
        () => openLightbox(index)
    );

    image.addEventListener(
        'load',
        () => resizeGalleryItem(galleryItem)
    );

    galleryItem.appendChild(image);

    gallery.appendChild(galleryItem);

});


/* CREATE THE MASONRY HEIGHT */

function resizeGalleryItem(item){

    if(window.innerWidth <= 600){
        item.style.gridRowEnd = '';
        return;
    }

    const galleryStyles =
        window.getComputedStyle(gallery);

    const rowHeight =
        parseInt(
            galleryStyles.getPropertyValue(
                'grid-auto-rows'
            )
        );

    const image =
        item.querySelector('img');

    const itemHeight =
        image.getBoundingClientRect().height +
        parseInt(
            window.getComputedStyle(item)
                .marginBottom
        );

    const rowSpan =
        Math.ceil(itemHeight / rowHeight);

    item.style.gridRowEnd =
        'span ' + rowSpan;

}


/* RECALCULATE AFTER WINDOW RESIZING */

function resizeAllGalleryItems(){

    document
        .querySelectorAll('.gallery-item')
        .forEach(resizeGalleryItem);

}

let resizeTimer;

window.addEventListener('resize', () => {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(
        resizeAllGalleryItems,
        150
    );

});


/* DISPLAY IMAGE IN LIGHTBOX */

function showImage(index){

    currentIndex =
        (index + galleryOrder.length) %
        galleryOrder.length;

    const selectedImage =
        galleryOrder[currentIndex];

    lightboxImage.src =
        selectedImage.image;

    lightboxImage.alt =
        selectedImage.title ||
        'Fine art photograph by Theodore Paulson';

    lightboxTitle.textContent =
        selectedImage.title || '';

}


/* OPEN LIGHTBOX */

function openLightbox(index){

    showImage(index);

    lightbox.classList.add('active');

    lightbox.setAttribute(
        'aria-hidden',
        'false'
    );

    document.body.classList.add(
        'lightbox-open'
    );

}


/* CLOSE LIGHTBOX */

function closeLightbox(){

    lightbox.classList.remove('active');

    lightbox.setAttribute(
        'aria-hidden',
        'true'
    );

    document.body.classList.remove(
        'lightbox-open'
    );

    lightboxImage.src = '';

}


/* LIGHTBOX BUTTONS */

lightboxClose.addEventListener(
    'click',
    closeLightbox
);

lightboxPrev.addEventListener(
    'click',
    event => {

        event.stopPropagation();

        showImage(currentIndex - 1);

    }
);

lightboxNext.addEventListener(
    'click',
    event => {

        event.stopPropagation();

        showImage(currentIndex + 1);

    }
);


/* CLOSE BY CLICKING BACKGROUND */

lightbox.addEventListener(
    'click',
    event => {

        if(event.target === lightbox){
            closeLightbox();
        }

    }
);


/* KEYBOARD CONTROLS */

document.addEventListener(
    'keydown',
    event => {

        if(
            !lightbox.classList.contains('active')
        ){
            return;
        }

        if(event.key === 'Escape'){
            closeLightbox();
        }

        if(event.key === 'ArrowLeft'){
            showImage(currentIndex - 1);
        }

        if(event.key === 'ArrowRight'){
            showImage(currentIndex + 1);
        }

    }
);

</script>

</body>

</html>
