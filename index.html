<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Adore Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#222;
    font-family:Georgia, serif;
}

header{
    background:#ffffff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 60px;
    border-bottom:1px solid #ececec;
}

.logo{
    width:240px;
    height:auto;
}

nav a{
    text-decoration:none;
    color:#6f6f6f;
    margin-left:40px;
    font-size:17px;
    letter-spacing:2px;
    transition:.25s;
}

nav a:hover{
    color:#1d5f97;
}

.hero img{
    width:100%;
    display:block;
}

.caption{
    text-align:center;
    padding:28px;
    font-size:24px;
    color:#666;
}

footer{
    text-align:center;
    padding:50px;
    color:#999;
    border-top:1px solid #ececec;
    font-size:15px;
}

</style>

</head>

<body>

<header>

<img src="oglogo.png"
     alt="The Adore Studio"
     class="logo">

<nav>

<a href="#">Gallery</a>
<a href="#">Books</a>
<a href="#">Prints</a>
<a href="#">About</a>

</nav>

</header>

<section class="hero">

<img src="homepage.jpg"
     alt="The Adore Studio">

</section>

<div class="caption">

Photography by Theodore Paulson

</div>

<footer>

© 2026 The Adore Studio

</footer>

</body>
</html>
