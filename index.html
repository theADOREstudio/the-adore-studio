      align-items: center;
      justify-content: space-between;

      padding: 0 52px;
      position: relative;
      z-index: 100;
    }

    .logo-link {
      display: block;
      width: 230px;
      flex-shrink: 0;
    }

    .logo-link img {
      display: block;
      width: 100%;
      height: auto;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 34px;
      padding-right: 4px;
    }

    .main-nav a {
      color: #5b3e2e;
      text-decoration: none;
      font-size: 17px;
      letter-spacing: 0.02em;
      transition: opacity 0.25s ease;
    }

    .main-nav a:hover {
      opacity: 0.55;
    }

    /* =========================================================
       SLIDESHOW
       ========================================================= */

    .slideshow {
      position: relative;
      width: 100%;
      height: calc(100vh - 196px);
      background: #fff;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      transition: opacity 1.6s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================================================
       CONTROLS
       ========================================================= */

    .slideshow-control {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 54px;
      height: 86px;

      border: none;
      background: rgba(0, 0, 0, 0.08);
      color: rgba(255, 255, 255, 0.72);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 44px;
      font-weight: 300;

      cursor: pointer;
      z-index: 20;

      opacity: 0;
      transition:
        opacity 0.25s ease,
        background 0.25s ease;
    }

    .slideshow:hover .slideshow-control,
    .slideshow:hover .pause-button {
      opacity: 1;
    }

    .slideshow-control:hover {
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
    }

    .previous {
      left: 0;
    }

    .next {
      right: 0;
    }

    .pause-button {
      position: absolute;
      right: 20px;
      bottom: 18px;

      width: 42px;
      height: 42px;

      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 50%;

      background: rgba(0,0,0,0.18);
      color: rgba(255,255,255,0.85);

      font-size: 15px;
      cursor: pointer;

      z-index: 20;
      opacity: 0;

      transition:
        opacity 0.25s ease,
        background 0.25s ease;
    }

    .pause-button:hover {
      background: rgba(0,0,0,0.45);
      color: #fff;
    }

       MOBILE
       ========================================================= */

      {image:"Gallery011.jpg",title:"Gallery 011",author:"Theodore Paulson"}

    ];


    /* =========================================================
       RANDOMIZE HOMEPAGE SLIDESHOW

       Creates a copy of the master list and shuffles it.
       The master list above is NEVER rearranged.
       ========================================================= */

    const slideshowImages = [...galleryImages];

    function shuffleImages(images) {

      for (let i = images.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [images[i], images[j]] = [images[j], images[i]];

      }

    }

    shuffleImages(slideshowImages);


    /* =========================================================
       SLIDESHOW ENGINE
       ========================================================= */

    const slideshow = document.getElementById("slideshow");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const pauseButton = document.getElementById("pauseButton");

    let currentIndex = 0;
    let isPlaying = true;
    let timer = null;

    const slideDuration = 6500;


    /* Create slides */

    slideshowImages.forEach((item, index) => {

      const slide = document.createElement("div");
      slide.className = "slide";

      if (index === 0) {
        slide.classList.add("active");
      }

      const img = document.createElement("img");

      img.src = "images/gallery/" + item.image;
      img.alt = item.title || "The Adore Studio photograph";

      if (index > 1) {
        img.loading = "lazy";
      }

      img.decoding = "async";

      slide.appendChild(img);

      slideshow.insertBefore(slide, previousButton);

    });


    const slides = document.querySelectorAll(".slide");


    /* =========================================================
       SHOW SLIDE
       ========================================================= */

    function showSlide(index) {

      slides[currentIndex].classList.remove("active");

      currentIndex = index;

      if (currentIndex < 0) {
        currentIndex = slides.length - 1;
      }

      if (currentIndex >= slides.length) {
        currentIndex = 0;
      }

      slides[currentIndex].classList.add("active");

      preloadNext();

    }


    /* =========================================================
       NEXT / PREVIOUS
       ========================================================= */

    function nextSlide() {
      showSlide(currentIndex + 1);
    }

    function previousSlide() {
      showSlide(currentIndex - 1);
    }


    /* =========================================================
       TIMER
       ========================================================= */

    function startTimer() {

      clearInterval(timer);

      if (!isPlaying) return;

      timer = setInterval(() => {
        nextSlide();
      }, slideDuration);

    }


    function restartTimer() {

      if (isPlaying) {
        startTimer();
      }

    }


    /* =========================================================
       PRELOAD NEXT IMAGE
       ========================================================= */

    function preloadNext() {

      const nextIndex =
        currentIndex + 1 >= slideshowImages.length
          ? 0
          : currentIndex + 1;

      const img = new Image();
      img.src = "images/gallery/" + slideshowImages[nextIndex].image;

    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    nextButton.addEventListener("click", () => {
      nextSlide();
      restartTimer();
    });

    previousButton.addEventListener("click", () => {
      previousSlide();
      restartTimer();
    });


    pauseButton.addEventListener("click", () => {

      isPlaying = !isPlaying;

      if (isPlaying) {

        pauseButton.textContent = "Ⅱ";
        pauseButton.setAttribute("aria-label", "Pause slideshow");
        pauseButton.title = "Pause slideshow";

        startTimer();

      } else {

        pauseButton.textContent = "▶";
        pauseButton.setAttribute("aria-label", "Play slideshow");
        pauseButton.title = "Play slideshow";

        clearInterval(timer);

      }

    });


    /* =========================================================
       KEYBOARD CONTROLS
       ========================================================= */

    document.addEventListener("keydown", (event) => {

      if (event.key === "ArrowRight") {
        nextSlide();
        restartTimer();
      }

      if (event.key === "ArrowLeft") {
        previousSlide();
        restartTimer();
      }

      if (event.key === " ") {

        event.preventDefault();
        pauseButton.click();

      }

    });


    /* =========================================================
       START
       ========================================================= */

    preloadNext();
    startTimer();

  </script>
