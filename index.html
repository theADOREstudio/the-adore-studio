<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Adore Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#222;
    font-family:Georgia, serif;
}

header{
    background:#ffffff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 60px;
    border-bottom:1px solid #ececec;
}

.logo{
    width:240px;
    height:auto;
}

nav a{
    text-decoration:none;
    color:#6f6f6f;
    margin-left:40px;
    font-size:17px;
    letter-spacing:2px;
    transition:.25s;
}

nav a:hover{
    color:#1d5f97;
}

.hero img{
    width:100%;
    display:block;
}

.caption{
    text-align:center;
    padding:28px;
    font-size:24px;
    color:#666;
}

footer{
    text-align:center;
    padding:50px;
    color:#999;
    border-top:1px solid #ececec;
    font-size:15px;
}
    
.gallery img{
    cursor:pointer;
}

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.lightbox.active{
    display:flex;
}

.lightbox img{
    max-width:95vw;
    max-height:90vh;
    width:auto;
    height:auto;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

.lightbox-close{
    position:absolute;
    top:18px;
    right:28px;
    color:white;
    font-size:42px;
    cursor:pointer;
    line-height:1;
}
    
</style>

</head>

<div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img id="lightboxImage" src="" alt="">
</div>
    <script>
const galleryImages = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
const lightboxClose = document.getElementById('lightboxClose');

galleryImages.forEach(image => {
    image.addEventListener('click', () => {
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        lightbox.classList.add('active');
    });
});

lightboxClose.addEventListener('click', () => {
    lightbox.classList.remove('active');
});

lightbox.addEventListener('click', event => {
    if (event.target === lightbox) {
        lightbox.classList.remove('active');
    }
});

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
        lightbox.classList.remove('active');
    }
});
</script>
<body>
    
<header>

    <img src="oglogo.png"
     alt="The Adore Studio"
     class="logo">

<nav>

<a href="gallery.html">Gallery</a>
<a href="books.html">Books</a>
<a href="#">Prints</a>
<a href="#">About</a>

</nav>

</header>

<section class="hero">

<img src="homepage.jpg"
     alt="The Adore Studio">

</section>

<div class="caption">

Photography by Theodore Paulson

</div>

<footer>

© 2026 The Adore Studio

</footer>

</body>
</html>
