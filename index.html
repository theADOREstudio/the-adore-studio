<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Adore Studio</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Georgia, serif;
}

.site-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
    padding:18px 32px;
    background:#111;
}

.logo{
    width:260px;
    max-width:42vw;
    height:auto;
    display:block;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:16px;
    letter-spacing:1px;
}

nav a:hover{
    color:white;
}

.hero-image{
    display:block;
    width:100%;
    height:auto;
}

.tagline{
    margin:0;
    padding:24px 20px;
    text-align:center;
    color:#ddd;
    font-size:21px;
    letter-spacing:1px;
}

footer{
    text-align:center;
    padding:30px 20px;
    color:#777;
    font-size:14px;
}

@media (max-width:700px){
    .site-header{
        flex-direction:column;
        padding:18px 16px;
    }

    .logo{
        width:230px;
        max-width:80vw;
    }

    nav{
        gap:18px;
        flex-wrap:wrap;
        justify-content:center;
    }
}
</style>
</head>

<body>

<header class="site-header">

    <img
        src="ChatGPT Image Jul 24, 2026, 03_06_21 PM.png"
        alt="The Adore Studio"
        class="logo"
    >

    <nav>
        <a href="#">Gallery</a>
        <a href="#">Books</a>
        <a href="#">Prints</a>
        <a href="#">About</a>
    </nav>

</header>

<main>

    <img
        src="Hero.jpg"
        alt="Surfer walking along the beach at sunset"
        class="hero-image"
    >

    <p class="tagline">Photography by Theodore Paulson</p>

</main>

<footer>
© 2026 The Adore Studio
</footer>

</body>
</html>
