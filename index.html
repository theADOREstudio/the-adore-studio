<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Adore Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#222;
    font-family:Georgia, serif;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 60px;
    border-bottom:1px solid #ececec;
    background:#fff;
}

.logo{
    width:240px;
    height:auto;
    display:block;
}

nav{
    display:flex;
    gap:40px;
}

nav a{
    text-decoration:none;
    color:#666;
    font-size:17px;
    letter-spacing:2px;
    transition:.25s;
}

nav a:hover{
    color:#1d5f97;
}

.hero{
    width:100%;
}

.hero img{
    width:100%;
    display:block;
}

.caption{
    text-align:center;
    padding:30px;
}

.caption h2{
    font-size:30px;
    font-weight:normal;
    margin-bottom:10px;
}

.caption p{
    color:#777;
    font-size:18px;
    line-height:1.6;
}

footer{
    text-align:center;
    padding:45px;
    color:#999;
    border-top:1px solid #ececec;
    font-size:15px;
}

@media(max-width:900px){

header{
    flex-direction:column;
    gap:25px;
    padding:25px;
}

nav{
    flex-wrap:wrap;
    justify-content:center;
    gap:22px;
}

.logo{
    width:220px;
}

.caption{
    padding:24px;
}

.caption h2{
    font-size:24px;
}

}

</style>

</head>

<body>

<header>

<a href="index.html">
    <img src="oglogo.png"
         alt="The Adore Studio"
         class="logo">
</a>

<nav>

<a href="index.html">Home</a>
<a href="gallery.html">Gallery</a>
<a href="books.html">Books</a>
<a href="#">Prints</a>
<a href="about.html">About</a>

</nav>

</header>

<section class="hero">

<img src="homepage.jpg"
     alt="The Adore Studio">

</section>

<section class="caption">

<h2>The Adore Studio</h2>

<p>
Fine art photography by Theodore Paulson.<br>
Studies in Light, Perspective, and Relief along Oregon's North Coast.
</p>

</section>

<footer>

© 2026 The Adore Studio

</footer>

</body>

</html>
