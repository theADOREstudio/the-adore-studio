<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Adore Studio</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Georgia, serif;
}

header{
    min-height:100vh;
    background-image:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.25)),
        url("Hero.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    text-align:center;
    padding:80px 20px;
}

h1{
    font-size:64px;
    letter-spacing:8px;
    font-weight:300;
    margin:0;
}

p{
    color:#cccccc;
    font-size:22px;
    margin-top:18px;
}

.hero{
    min-height:100vh;
    background-image:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.25)),
        url("Hero.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    text-align:center;
    padding:80px 20px;
}

 .hero-overlay{
    width:100%;
}

.logo{
    width:min(900px, 92vw);
    height:auto;
    display:block;
    margin:0 auto;
}   
.hero img{
    display:block;
    width:100%;
    height:auto;
    max-height:82vh;
    object-fit:cover;
    object-position:center;
}

footer{
    text-align:center;
    padding:40px;
    color:#777;
}
</style>

</head>

<body>

<header class="hero">
    <div class="hero-overlay">
        <img
            src="ChatGPT Image Jul 24, 2026, 03_06_21 PM.png"
            alt="The Adore Studio"
            class="logo"
        >

        <p>Photography by Theodore Paulson</p>
    </div>
</header>

<footer>
© 2026 The Adore Studio
</footer>

</body>
</html>
